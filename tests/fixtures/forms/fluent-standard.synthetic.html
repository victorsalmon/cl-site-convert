  Site IR v1.1 can express, plus the controls it cannot (password, time) and the
  security fields whose VALUES must never be recorded.

  This file is authored, not captured - the live site serves only the
  conversational shape (see fluent-form-3.query.html). It is built from Fluent
  Forms 6.2.17's own standard markup conventions so the generic parser is tested
  against the real plugin's structure: `frm-fluent-form`/`fluent_form_<id>` classes,
  `data-form_id`, the `_fluentform_<id>_fluentformnonce` hidden input, the
  `ff_hp` honeypot and the `cf-turnstile` widget.

  The nonce value below is a fixed dummy, not a captured token: a test asserts the
  extractor never reproduces it.
-->
